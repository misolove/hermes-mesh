[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-mesh"
version = "0.1.0"
description = "Policy-bound MCP nodes for safe Hermes-to-machine and Hermes-to-Hermes control over private networks."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Lerippi"}]
dependencies = [
  "mcp>=1.0.0",
  "pydantic>=2.0.0",
  "PyYAML>=6.0.0",
  "starlette>=0.37.0",
  "uvicorn>=0.30.0"
]

[project.scripts]
hermes-mesh = "hermes_mesh.cli:main"
hermes-mesh-daemon = "hermes_mesh.daemon:main"
hermes-mesh-node = "hermes_mesh.server:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
